name: Publish News for iPhone Shortcut

on:
  schedule:
    # 6:00 AM IST
    - cron: "30 0 * * *"
    # 6:00 PM IST
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-news-json
  cancel-in-progress: false

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAX_PER_CATEGORY: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch news and write JSON
        run: python publish_news.py

      - name: Commit updated news JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then
            echo "No news JSON changes to commit."
          else
            git commit -m "Update news digest data"
            git push
          fi
